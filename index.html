<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drifting Graphing Calculator</title>
  <link rel="stylesheet" href="graphing.css">
  <link rel="stylesheet" href="font-awesome-4.7.0/css/font-awesome.min.css">
</head>
<body>
  <header id="header">
    <div class="logo">
        <h1>Drifting Graphing Calculator</h1>
    </div>
    <nav id="navbar">
    </nav>
  </header>
  
  <main>
    <section id="calc-panel"></section>
    <section id="graphing-panel">
      <canvas id="my-canvas"></canvas>
      <div id="zoom-panel">
        <button class="btn" id="zoom-in">
          <span>&plus;</span>
          <span class="tag">Zoom In</span>
        </button>
        
        <button class="btn" id="zoom-out">
          <span>&minus;</span>
          <span  class="tag">Zoom Out</span>
        </button>

        <button class="btn" id="home">
          <span><i class="fa fa-home" aria-hidden="true"></i></span>
          <span  class="tag">Home</span>
        </button>
      </div>
    </section>
  </main>
    

  <script src="graphing.js"></script>
</body>
</html>
