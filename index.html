<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drifting Graphing Calculator</title>
  <link rel="stylesheet" href="graphing.css">
</head>
<body>
  <header id="header">
    <div class="logo">
        <h1>Drifting Graphing Calculator</h1>
    </div>
    <nav id="navbar">
    </nav>
  </header>
  
  <main>
    <section id="calc-panel"></section>
    <section id="graphing-panel">
      <canvas id="my-canvas"></canvas>
      <div id="zoom-panel">
        <button class="btn" id="zoom-in">&plus;</button>
        <span class="tag" id="tag-zoom-in">Zoom In</span>
        <button class="btn" id="zoom-out">&minus;</button>
        <span  class="tag" id="tag-zoom-out">Zoom Out</span>
      </div>
    </section>
  </main>
    

  <script src="graphing.js"></script>
</body>
</html>
